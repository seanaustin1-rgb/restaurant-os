<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spirit Vault — Echo's Reserve</title>
<meta name="description" content="The Spirit Vault at Echo's Reserve — a private deep-dive into every bottle on the shelf. Available only while you're here.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e0c08;
  --char: #16130c;
  --surface: #1c1810;
  --surface2: #241f14;
  --gold: #c8901a;
  --gold-light: #e8b84a;
  --gold-dim: rgba(200,144,26,0.12);
  --gold-border: rgba(200,144,26,0.28);
  --hairline: rgba(200,144,26,0.10);
  --parchment: #f2e8d4;
  --cream: #faf6ee;
  --muted: #a3967d;
  --smoke: #7a6e56;
  --good: #7fb069;
  --warn: #d9a441;
  --rare: #b46ac4;
  --event: #6aa7c4;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:'Cormorant Garamond',serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.22;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
}

.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;background:var(--ink);}
@media(min-width:600px){
  body{background:#080705;}
  .app{border-left:1px solid var(--hairline);border-right:1px solid var(--hairline);}
}

/* ═══ TOP BAR ═══ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(14,12,8,0.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--gold-border);
  padding:14px 18px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.tb-brand{line-height:1.05;}
.tb-vault{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--gold-light);letter-spacing:0.02em;}
.tb-sub{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.28em;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.session-chip{
  display:flex;align-items:center;gap:7px;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.12em;
  color:var(--gold-light);
  border:1px solid var(--gold-border);
  padding:7px 11px;background:var(--gold-dim);
  white-space:nowrap;
}
.session-dot{width:6px;height:6px;border-radius:50%;background:var(--good);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
.session-chip .t{font-variant-numeric:tabular-nums;}

/* ═══ VIEW SWITCH ═══ */
.view{display:none;}
.view.active{display:block;animation:fadeIn 0.35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ═══ BOTTLE NAV STRIP ═══ */
.bottle-nav{
  position:sticky;top:57px;z-index:90;
  background:rgba(20,17,11,0.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hairline);
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 18px;
}
.bn-btn{
  background:none;border:1px solid var(--gold-border);color:var(--gold-light);
  font-family:'DM Mono',monospace;font-size:12px;
  width:32px;height:32px;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;justify-content:center;
}
.bn-btn:hover{background:var(--gold-dim);}
.bn-center{text-align:center;}
.bn-index{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.22em;color:var(--gold);font-variant-numeric:tabular-nums;}
.bn-dots{display:flex;gap:6px;justify-content:center;margin-top:6px;}
.bn-dot{width:5px;height:5px;border-radius:50%;background:var(--smoke);opacity:0.4;transition:all 0.25s;cursor:pointer;}
.bn-dot.on{background:var(--gold-light);opacity:1;transform:scale(1.25);}
.bn-vault-link{
  background:none;border:none;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--muted);padding:6px 0 0;
  transition:color 0.2s;display:block;margin:0 auto;
}
.bn-vault-link:hover{color:var(--gold-light);}
/* Contextual back control — appears only when arriving via a Compare & Continue link */
.bn-back{
  display:none;width:100%;min-height:44px;box-sizing:border-box;
  align-items:center;gap:8px;
  background:var(--gold-dim);border:none;border-bottom:1px solid var(--hairline);
  color:var(--gold-light);cursor:pointer;text-align:left;
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;
  padding:0 18px;transition:background 0.2s;
  position:sticky;top:106px;z-index:89;backdrop-filter:blur(10px);
}
.bn-back.show{display:flex;}
.bn-back:hover{background:var(--gold-border);}
.bn-back .bb-arrow{font-size:13px;line-height:1;}
.bn-back .bb-name{color:var(--muted);text-transform:none;letter-spacing:0.04em;font-size:8.5px;}

/* ═══ DETAIL BODY ═══ */
.detail-body{padding:22px 18px 90px;}

/* ═══ HERO ═══ */
.hero{
  position:relative;text-align:center;
  padding:30px 18px 26px;
  border:1px solid var(--gold-border);
  background:
    radial-gradient(ellipse 70% 45% at 50% 32%, rgba(200,144,26,0.13), transparent 70%),
    var(--char);
  margin-bottom:14px;overflow:hidden;
}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.hero-cat{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;}
.hero-bottle{height:150px;margin:0 auto 6px;display:block;filter:drop-shadow(0 14px 22px rgba(0,0,0,0.55));}
.hero-name{font-family:'Playfair Display',serif;font-size:29px;font-weight:700;color:var(--cream);line-height:1.12;margin:12px 0 6px;}
.hero-distillery{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
.hero-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:20px;}
.chip{
  font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.14em;text-transform:uppercase;
  padding:6px 11px;border:1px solid var(--gold-border);color:var(--parchment);
  display:inline-flex;align-items:center;gap:6px;
}
.chip .dot{width:5px;height:5px;border-radius:50%;}
.chip.available{border-color:rgba(127,176,105,0.45);color:#b9d8ab;}
.chip.available .dot{background:var(--good);}
.chip.low{border-color:rgba(217,164,65,0.5);color:#ecd39c;}
.chip.low .dot{background:var(--warn);}
.chip.reserve{border-color:rgba(180,106,196,0.45);color:#d8b3e2;}
.chip.reserve .dot{background:var(--rare);}
.chip.flight{border-color:rgba(106,167,196,0.45);color:#b4d5e6;}
.chip.flight .dot{background:var(--event);}
.chip.eventb{border-color:rgba(106,167,196,0.45);color:#b4d5e6;}
.chip.eventb .dot{background:var(--event);}
.chip.draft{border-color:rgba(163,150,125,0.45);color:var(--muted);}
.chip.draft .dot{background:var(--smoke);}
.hero-specs{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--hairline);
}
.hspec{padding:13px 4px 2px;border-right:1px solid var(--hairline);}
.hspec:last-child{border-right:none;}
.hspec .v{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--gold-light);font-variant-numeric:tabular-nums;line-height:1.1;}
.hspec .l{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--smoke);margin-top:5px;}
.hero-style{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--muted);margin-top:14px;}

/* ═══ CARDS ═══ */
.card{
  border:1px solid var(--gold-border);
  background:var(--surface);
  padding:20px 18px;
  margin-bottom:14px;
}
.card-eyebrow{
  font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.26em;
  text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.card-eyebrow::after{content:'';flex:1;height:1px;background:var(--hairline);}

/* ═══ FLAVOR DASHBOARD ═══ */
.radar-wrap{display:flex;justify-content:center;padding:4px 0 10px;}
.flavor-bars{margin-top:8px;}
.fbar{display:grid;grid-template-columns:56px 1fr 26px;align-items:center;gap:10px;margin-bottom:9px;}
.fbar .fl{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
.fbar .ftrack{height:5px;background:rgba(200,144,26,0.09);position:relative;overflow:visible;}
.fbar .ffill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(200,144,26,0.55),var(--gold-light));border-radius:0 3px 3px 0;transition:width 0.7s cubic-bezier(0.2,0.8,0.2,1);}
.fbar .fv{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold-light);text-align:right;font-variant-numeric:tabular-nums;}
.fbar-divider{height:1px;background:var(--hairline);margin:14px 0;}
.fbar.meta .ffill{background:linear-gradient(90deg,rgba(163,150,125,0.4),var(--parchment));}
.fbar.meta .fv{color:var(--parchment);}

/* ═══ PRODUCTION SPECS ═══ */
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hairline);border:1px solid var(--hairline);}
.spec-cell{background:var(--char);padding:12px 13px;}
.spec-cell.wide{grid-column:1 / -1;}
.spec-cell .sl{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--smoke);margin-bottom:5px;}
.spec-cell .sv{font-family:'Cormorant Garamond',serif;font-size:15.5px;font-weight:600;color:var(--cream);line-height:1.3;}
.prod-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.prod-tag{
  font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.14em;text-transform:uppercase;
  padding:6px 10px;background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--gold-light);
}

/* ═══ WHY IT MATTERS ═══ */
.why-text{font-family:'Cormorant Garamond',serif;font-size:17.5px;font-weight:300;line-height:1.65;color:var(--parchment);}
.why-text em{color:var(--gold-light);}

/* ═══ AWARDS ═══ */
.award-row{display:flex;flex-wrap:wrap;gap:10px;}
.award{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--gold-border);background:var(--char);
  padding:10px 14px 10px 10px;flex:1 1 calc(50% - 5px);min-width:150px;
}
.award-medal{width:30px;height:30px;flex-shrink:0;}
.award .at{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-light);line-height:1.45;}
.award .as{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:0.08em;color:var(--smoke);margin-top:3px;display:block;text-transform:uppercase;}

/* ═══ COMPARE ═══ */
.compare-intro{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--muted);margin-bottom:14px;}
.compare-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px;}
.compare-scroll::-webkit-scrollbar{display:none;}
.cmp-card{
  flex:0 0 150px;border:1px solid var(--hairline);background:var(--char);
  padding:14px 13px;cursor:pointer;transition:border-color 0.2s;position:relative;
}
.cmp-card:hover{border-color:var(--gold);}
.cmp-card .cn{font-family:'Playfair Display',serif;font-size:14.5px;font-weight:600;color:var(--cream);line-height:1.25;margin-bottom:7px;}
.cmp-card .cd{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.08em;color:var(--muted);line-height:1.5;text-transform:uppercase;}
.cmp-card .cwhy{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;color:var(--smoke);margin-top:9px;line-height:1.4;}
.cmp-card .cgo{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.14em;color:var(--gold);margin-top:10px;text-transform:uppercase;}
.cmp-card.invault{border-color:var(--gold-border);}

/* ═══ PAIRINGS ═══ */
.pair-row{display:grid;grid-template-columns:34px 74px 1fr;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--hairline);}
.pair-row:last-child{border-bottom:none;}
.pair-icon{font-size:15px;text-align:center;filter:grayscale(0.3) sepia(0.3);align-self:center;}
.pair-type{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);}
.pair-val{font-family:'Cormorant Garamond',serif;font-size:15.5px;color:var(--parchment);line-height:1.4;}

/* ═══ DISTILLERY ═══ */
.dist-plate{
  border:1px solid var(--hairline);background:var(--char);
  display:grid;grid-template-columns:86px 1fr;gap:0;margin-bottom:16px;
}
.dist-ping{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--hairline);}
.dist-loc{padding:14px 15px;}
.dist-loc .dn{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--cream);margin-bottom:4px;}
.dist-loc .dp{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.12em;color:var(--muted);line-height:1.7;text-transform:uppercase;}
.dist-loc .dcoord{color:var(--gold);}
.dist-history{font-family:'Cormorant Garamond',serif;font-size:15.5px;font-weight:300;line-height:1.6;color:var(--parchment);margin-bottom:18px;}
.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--gold-border);}
.tl-item{position:relative;padding-bottom:15px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:-21px;top:5px;width:7px;height:7px;background:var(--ink);border:1.5px solid var(--gold);border-radius:50%;}
.tl-year{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:0.12em;color:var(--gold-light);margin-bottom:3px;}
.tl-text{font-family:'Cormorant Garamond',serif;font-size:14.5px;color:var(--muted);line-height:1.45;}

/* ═══ BEHIND THE BOTTLE ═══ */
.btb-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hairline);border:1px solid var(--hairline);margin-bottom:16px;}
.btb-stat{background:var(--char);padding:14px 13px;text-align:center;}
.btb-stat .v{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--gold-light);line-height:1.15;}
.btb-stat .l{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--smoke);margin-top:5px;}
.fact-item{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--hairline);align-items:baseline;}
.fact-item:last-child{border-bottom:none;}
.fact-item .fd{color:var(--gold);font-size:10px;flex-shrink:0;}
.fact-item .ft{font-family:'Cormorant Garamond',serif;font-size:15.5px;color:var(--parchment);line-height:1.5;}

/* ═══ SEAN'S NOTES ═══ */
.card.notes{
  background:linear-gradient(160deg, rgba(200,144,26,0.07), transparent 55%), var(--surface);
  border-color:var(--gold);
}
.notes-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;font-weight:300;line-height:1.65;color:var(--cream);}
.notes-sig{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:var(--gold-light);margin-top:14px;}
.notes-sig span{display:block;font-family:'DM Mono',monospace;font-style:normal;font-size:7.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--smoke);margin-top:4px;}

/* ═══ FOOTER / COMING SOON ═══ */
.vault-footer{padding:8px 4px 20px;text-align:center;}
.vf-coming{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--smoke);line-height:2.2;}
.vf-coming b{color:var(--muted);font-weight:400;}

/* ═══ VAULT (BROWSE) VIEW ═══ */
.vault-head{padding:26px 18px 6px;}
.vault-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--cream);}
.vault-title em{font-style:italic;color:var(--gold-light);}
.vault-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--muted);margin-top:6px;}
.filter-block{padding:14px 18px 4px;}
.filter-label{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--smoke);margin:10px 0 7px;}
.filter-row{display:flex;flex-wrap:wrap;gap:7px;}
.fchip{
  font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:0.12em;text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--hairline);color:var(--muted);
  background:none;cursor:pointer;transition:all 0.2s;
}
.fchip:hover{border-color:var(--gold-border);color:var(--parchment);}
.fchip.on{border-color:var(--gold);color:var(--gold-light);background:var(--gold-dim);}
.vault-count{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;color:var(--smoke);padding:16px 18px 10px;}
.vault-grid{padding:0 18px 30px;display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.vcard{
  border:1px solid var(--gold-border);background:var(--surface);
  padding:16px 13px 14px;cursor:pointer;transition:all 0.2s;text-align:center;position:relative;
}
.vcard:hover{border-color:var(--gold);transform:translateY(-2px);}
.vcard-bottle{height:74px;margin:2px auto 10px;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,0.5));}
.vcard .vn{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--cream);line-height:1.2;margin-bottom:6px;}
.vcard .vd{font-family:'DM Mono',monospace;font-size:7.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);line-height:1.7;}
.vcard .vstatus{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;}
.vcard .vstatus.available{background:var(--good);}
.vcard .vstatus.low{background:var(--warn);}
.vcard .vstatus.reserve{background:var(--rare);}
.vcard .vstatus.eventb{background:var(--event);}
.vcard .vstatus.draft{background:var(--smoke);}
.vault-note{
  margin:0 18px 30px;padding:16px 18px;border:1px dashed var(--gold-border);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14.5px;color:var(--smoke);line-height:1.55;text-align:center;
}
.vault-note b{color:var(--muted);font-weight:600;}

/* ═══ SWIPE HINT ═══ */
.swipe-hint{
  text-align:center;font-family:'DM Mono',monospace;font-size:8px;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--smoke);
  padding:2px 0 16px;animation:hintFade 5s forwards;
}
@keyframes hintFade{0%,70%{opacity:1;}100%{opacity:0.35;}}

/* ═══ V2: COMPACT HERO OVERRIDES ═══ */
.hero{padding:22px 16px 18px;}
.hero-cat{margin-bottom:12px;}
.hero-name{font-size:clamp(21px,6.5vw,27px);margin:10px 0 5px;overflow-wrap:break-word;}
.hero-distillery{margin-bottom:14px;line-height:1.6;overflow-wrap:break-word;}
.hero-chips{margin-bottom:16px;}
.hero-style{margin-top:12px;font-size:14px;}

/* ═══ V2: FLAVOR SNAPSHOT ═══ */
.snapshot{padding:16px 18px;}
.snap-grid{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;}
.snap-radar{max-width:104px;}
.tnote{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--hairline);}
.tnote:last-child{border-bottom:none;}
.tn-rank{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold);letter-spacing:0.1em;}
.tn-text{font-family:'Playfair Display',serif;font-size:16.5px;font-weight:600;color:var(--cream);}

function normalizeSpiritRecord(base, details){
  const merged = {...base, ...(details || {})};
  const recordStatus = merged.recordStatus || 'published';
  const publicationStatus = merged.publicationStatus || recordStatus;
  const verificationStatus = merged.verificationStatus || 'unverified';
  const displayNameParts = (merged.name || '').split(' ');
  const derivedBrand = merged.brand || displayNameParts.slice(0, Math.min(2, displayNameParts.length)).join(' ');
  return {
    ...merged,
    schemaVersion:merged.schemaVersion || 'spirit-v1',
    recordStatus,
    publicationStatus,
    verificationStatus,
    brand:merged.brand || derivedBrand,
    expression:merged.expression || (merged.name || '').replace(derivedBrand, '').trim() || null,
    subcategory:merged.subcategory || null,
    country:merged.country || null,
    region:merged.region || null,
    distilleryName:merged.distilleryName || merged.dist?.name || merged.distillery || null,
    identity:merged.identity || {
      brand:merged.brand || derivedBrand,
      expression:merged.expression || null,
      displayName:merged.name,
      category:merged.cat,
      subcategory:merged.subcategory || null,
      imageKey:merged.silo,
      styleLine:merged.style,
    },
    strength:merged.strength || {
      proof:merged.proofN,
      age:merged.ageData || {text:merged.age,minYears:null,maxYears:null,unaged:merged.age === 'Unaged'},
    },
    commerce:{
      ...DEFAULT_COMMERCE_FIELDS,
      ...(merged.commerce || {}),
    },
    provenance:{
      addedAt:'2026-07-26',
      updatedAt:'2026-07-26',
      reviewedAt:merged.reviewedAt || null,
      reviewedBy:null,
      sources:[],
      ...(merged.provenance || {}),
    },
    awards:(merged.awards || []).map(entry=>({verified:false, sourceUrl:null, ...entry})),
    press:(merged.press || []).map(entry=>({sourceUrl:null, ...entry})),
    dataVersion:SPIRIT_DATA_VERSION,
  };
}

function normalizeSpiritRecords(spiritData, dossierDetails){
  return spiritData.map(base => normalizeSpiritRecord(base, dossierDetails[base.id]));
}

function isBlank(value){
  return value === undefined || value === null || (typeof value === 'string' && value.trim() === '');
}

function isValidIsoDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return false;
  const parsed = new Date(value + 'T00:00:00Z');
  return !Number.isNaN(parsed.getTime()) && parsed.toISOString().slice(0,10) === value;
}

function pushMissing(errors, spirit, field){
  errors.push(`${spirit.id || '(missing id)'}: missing required field "${field}"`);
}

function validateSpiritRecords(records){
  const errors = [];
  const seen = new Set();
  const ids = new Set(records.map(spirit => spirit.id).filter(Boolean));

  records.forEach((spirit, index)=>{
    const isDraft = spirit.recordStatus === 'draft';
    REQUIRED_SPIRIT_FIELDS.forEach(field=>{
      const value = spirit[field];
      if(isBlank(value) || (Array.isArray(value) && value.length === 0 && !isDraft)) pushMissing(errors, spirit, field);
    });

    if(spirit.id){
      if(seen.has(spirit.id)) errors.push(`${spirit.id}: duplicate id`);
      seen.add(spirit.id);
    }

    if(!RECORD_STATUSES.includes(spirit.recordStatus)){
      errors.push(`${spirit.id}: invalid recordStatus "${spirit.recordStatus}"`);
    }
    if(!PUBLICATION_STATUSES.includes(spirit.publicationStatus)){
      errors.push(`${spirit.id}: invalid publicationStatus "${spirit.publicationStatus}"`);
    }
    if(!VERIFICATION_STATUSES.includes(spirit.verificationStatus)){
      errors.push(`${spirit.id}: invalid verificationStatus "${spirit.verificationStatus}"`);
    }

    if(spirit.topNotes && spirit.topNotes.length !== 3){
      errors.push(`${spirit.id}: topNotes must contain exactly 3 entries`);
    }

    FLAVOR_AXES.forEach(axis=>{
      const value = spirit.flavor?.[axis];
      if(typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > 10){
        errors.push(`${spirit.id}: invalid flavor axis "${axis}" value "${value}"`);
      }
    });
    Object.keys(spirit.flavor || {}).forEach(axis=>{
      if(!FLAVOR_AXES.includes(axis)) errors.push(`${spirit.id}: unknown flavor axis "${axis}"`);
    });
    [['body',spirit.body],['finish',spirit.finish]].forEach(([field,value])=>{
      if(typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > 10){
        errors.push(`${spirit.id}: invalid ${field} value "${value}"`);
      }
    });

    (spirit.press || []).forEach((entry, pressIndex)=>{
      const prefix = `${spirit.id}: press[${pressIndex}]`;
      if(!entry || typeof entry !== 'object'){
        errors.push(`${prefix} must be an object`);
        return;
      }
      if(entry.date !== null && entry.date !== undefined && !isValidIsoDate(entry.date)) errors.push(`${prefix} has invalid date "${entry.date}"`);
      ['type','source','title','summary'].forEach(field=>{
        if(isBlank(entry[field])) errors.push(`${prefix} missing "${field}"`);
      });
      if(typeof entry.verified !== 'boolean') errors.push(`${prefix} verified must be boolean`);
      if(!PRESS_TYPES.includes(entry.type)) errors.push(`${prefix} has invalid type "${entry.type}"`);
      if(entry.verified && isBlank(entry.sourceUrl)) errors.push(`${prefix} verified=true requires sourceUrl`);
      if(entry.verified && !isValidIsoDate(entry.date)) errors.push(`${prefix} verified=true requires source date`);
    });

    (spirit.awards || []).forEach((entry, awardIndex)=>{
      const prefix = `${spirit.id}: awards[${awardIndex}]`;
      if(isBlank(entry.t) || isBlank(entry.s)) errors.push(`${prefix} missing title/source`);
      if(typeof entry.verified !== 'boolean') errors.push(`${prefix} verified must be boolean`);
      if(entry.verified && isBlank(entry.sourceUrl)) errors.push(`${prefix} verified=true requires sourceUrl`);
    });

    PATH_TYPES.forEach(pathType=>{
      const entries = spirit.paths?.[pathType];
      if(!Array.isArray(entries)){
        errors.push(`${spirit.id}: paths.${pathType} must be an array`);
        return;
      }
      entries.forEach((entry, pathIndex)=>{
        if(entry.ref && !ids.has(entry.ref)){
          errors.push(`${spirit.id}: paths.${pathType}[${pathIndex}] references unknown spirit "${entry.ref}"`);
        }
        ['name','d','why'].forEach(field=>{
          if(isBlank(entry[field])) errors.push(`${spirit.id}: paths.${pathType}[${pathIndex}] missing "${field}"`);
        });
      });
    });

    if(typeof spirit.proofN !== 'number' || !Number.isFinite(spirit.proofN)){
      errors.push(`${spirit.id || `record ${index}`}: proofN must be numeric`);
    }
    if(!/^\$\d+(\.\d{2})?$|^Pending$/.test(spirit.price || '')){
      errors.push(`${spirit.id}: invalid price display "${spirit.price}"`);
    }
    if(spirit.commerce.pourPriceUsd !== null && (typeof spirit.commerce.pourPriceUsd !== 'number' || !Number.isFinite(spirit.commerce.pourPriceUsd))){
      errors.push(`${spirit.id}: commerce.pourPriceUsd must be numeric or null`);
    }
    if(spirit.commerce.pourPriceUsd !== null && isBlank(spirit.commerce.priceProvenance)){
      errors.push(`${spirit.id}: temporary price requires priceProvenance`);
    }
    if(spirit.provenance?.sources?.some(source=>isBlank(source.url))){
      errors.push(`${spirit.id}: provenance source missing url`);
    }
  });

  if(errors.length){
    console.error('Spirit Vault data validation failed:', errors);
    const isDev = location.protocol === 'file:' || ['','localhost','127.0.0.1'].includes(location.hostname);
    if(isDev) throw new Error(`Spirit Vault data validation failed (${errors.length} issue${errors.length===1?'':'s'}). See console.`);
  }
}

const LIQUID = {bourbon:'#8a4d12', scotch:'#a3611e', tequila:'#cfc9b8', rum:'#5f3410'};

function bottleSVG(silo, h){
  const liq = LIQUID[silo] || '#8a4d12';
  const blancoOp = silo==='tequila' ? '0.45' : '0.92';
  let body;
  if(silo==='rum'){
    body = `M24 8 h12 v26 q0 5 8 9 q12 6 12 16 v78 q0 9 -9 9 H21 q-9 0 -9 -9 V59 q0 -10 12 -16 q8 -4 8 -9 z`;
  } else if(silo==='tequila'){
    body = `M25 8 h10 v40 q0 4 5 7 q7 4 7 12 v72 q0 8 -8 8 H21 q-8 0 -8 -8 V67 q0 -8 7 -12 q5 -3 5 -7 z`;
  } else if(silo==='scotch'){
    body = `M25 8 h10 v30 q0 6 7 11 q9 7 9 17 v68 q0 9 -9 9 H18 q-9 0 -9 -9 V66 q0 -10 9 -17 q7 -5 7 -11 z`;
  } else {
    body = `M25 8 h10 v32 q0 5 6 9 q10 6 10 15 v72 q0 8 -8 8 H17 q-8 0 -8 -8 V64 q0 -9 10 -15 q6 -4 6 -9 z`;
  }
  const uid = 'g' + silo + Math.floor(h);
  return `<svg viewBox="0 0 60 148" style="height:${h}px" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="${liq}" stop-opacity="${blancoOp}"/>
        <stop offset="0.45" stop-color="${liq}" stop-opacity="${silo==='tequila'?'0.25':'0.65'}"/>
        <stop offset="1" stop-color="${liq}" stop-opacity="${blancoOp}"/>
      </linearGradient>
    </defs>
    <path d="${body}" fill="url(#${uid})" stroke="rgba(200,144,26,0.4)" stroke-width="1"/>
    <rect x="23.5" y="2" width="13" height="8" rx="1.5" fill="#c8901a" opacity="0.9"/>
    <rect x="14" y="82" width="32" height="26" fill="#f2e8d4" opacity="0.10" stroke="rgba(200,144,26,0.35)" stroke-width="0.7"/>
    <rect x="17" y="46" width="3.5" height="52" rx="1.7" fill="#ffffff" opacity="0.07"/>
  </svg>`;
}

function radarSVG(flavor){
  const cx=150, cy=122, R=88, N=FLAVOR_AXES.length;
  const pt=(i,r)=>{const a=-Math.PI/2 + i*2*Math.PI/N; return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  let rings='';
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts=FLAVOR_AXES.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
    rings+=`<polygon points="${pts}" fill="none" stroke="rgba(200,144,26,${f===1?0.28:0.10})" stroke-width="1"/>`;
  });
  let axes='', labels='';
  FLAVOR_AXES.forEach((ax,i)=>{
    const [x,y]=pt(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(200,144,26,0.10)" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+18);
    const anchor = Math.abs(lx-cx)<8 ? 'middle' : (lx>cx?'start':'end');
    labels+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="${anchor}" font-family="DM Mono,monospace" font-size="8.5" letter-spacing="1" fill="#a3967d">${ax.toUpperCase()}</text>
    <text x="${lx.toFixed(1)}" y="${(ly+14).toFixed(1)}" text-anchor="${anchor}" font-family="DM Mono,monospace" font-size="8" fill="#e8b84a">${flavor[ax]}</text>`;
  });
  const valPts=FLAVOR_AXES.map((ax,i)=>pt(i,R*flavor[ax]/10).map(v=>v.toFixed(1)).join(',')).join(' ');
  let dots='';
  FLAVOR_AXES.forEach((ax,i)=>{
    const [x,y]=pt(i,R*flavor[ax]/10);
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#e8b84a" stroke="#0e0c08" stroke-width="1.5"/>`;
  });
  return `<svg viewBox="0 0 300 258" style="width:100%;max-width:330px" role="img" aria-label="Flavor profile radar chart">
    ${rings}${axes}
    <polygon points="${valPts}" fill="rgba(200,144,26,0.22)" stroke="#e8b84a" stroke-width="1.8" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

/* ═══════════════════════════════════════════════
   MEDAL ICON
═══════════════════════════════════════════════ */

function medalSVG(){
  return `<svg class="award-medal" viewBox="0 0 30 30" aria-hidden="true">
    <path d="M10 2 L15 10 L20 2" fill="none" stroke="#c8901a" stroke-width="2.5"/>
    <circle cx="15" cy="18" r="8.5" fill="rgba(200,144,26,0.15)" stroke="#e8b84a" stroke-width="1.5"/>
    <path d="M15 13.5 l1.4 2.9 3.2 .4 -2.3 2.2 .5 3.1 -2.8 -1.5 -2.8 1.5 .5 -3.1 -2.3 -2.2 3.2 -.4 z" fill="#e8b84a"/>
  </svg>`;
}

/* ═══════════════════════════════════════════════
   DETAIL RENDER
═══════════════════════════════════════════════ */

let current = 0;
let navStack = [];   // trail of dossiers visited via Compare & Continue links

function fbarRow(label, val, meta){
  return `<div class="fbar${meta?' meta':''}">
    <span class="fl">${label}</span>
    <span class="ftrack"><span class="ffill" style="width:${val*10}%"></span></span>
    <span class="fv">${val}</span>
  </div>`;
}

function fmtDate(iso){
  return new Date(iso+'T00:00:00Z').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'});
}

function radarMini(flavor){
  const cx=60, cy=60, R=48, N=FLAVOR_AXES.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let rings='';
  [0.5,1].forEach(f=>{
    rings+=`<polygon points="${FLAVOR_AXES.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="rgba(200,144,26,${f===1?0.3:0.12})" stroke-width="1"/>`;
  });
  const val=FLAVOR_AXES.map((ax,i)=>pt(i,R*flavor[ax]/10).map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 120 120" style="width:100%;display:block" aria-hidden="true">${rings}
    <polygon points="${val}" fill="rgba(200,144,26,0.25)" stroke="#e8b84a" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function toggleDrawer(btn){
  const open = btn.getAttribute('aria-expanded')==='true';
  btn.setAttribute('aria-expanded', String(!open));
  btn.nextElementSibling.hidden = open;
}

function drawer(id,label,inner,cls){
  return `<section class="drawer${cls?' '+cls:''}">
    <button class="drawer-head" aria-expanded="false" aria-controls="dw-${id}" onclick="toggleDrawer(this)">
      <span class="dh-label">${label}</span><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="drawer-body" id="dw-${id}" hidden>${inner}</div>
  </section>`;
}

/* Stable-ID lookups — recommendation links and all future flight
   references resolve by spirit id, never by array position or name. */
function spiritIndexById(id){ return BOTTLES.findIndex(x=>x.id===id); }
function gotoBottleId(id){ const i = spiritIndexById(id); if(i>=0 && i!==current){ navStack.push(current); gotoBottle(i); } }

function cmpRow(c){
  const idx = c.ref ? spiritIndexById(c.ref) : -1;
  const go = idx>=0 ? `onclick="gotoBottleId('${c.ref}')" role="button" tabindex="0"` : '';
  const tag = idx>=0 ? 'Open dossier →' : 'On the shelf · dossier at launch';
  return `<div class="cmp-row${idx>=0?' invault':''}" ${go}>
    <span class="cn">${c.name}</span>
    <div class="cd">${c.d}</div>
    <div class="cwhy">${c.why}</div>
    <div class="cgo">${tag}</div>
  </div>`;
}

function renderDetail(i){
  current = i;
  const b = BOTTLES[i];

  document.getElementById('bnIndex').textContent =
    String(i+1).padStart(2,'0') + ' / ' + String(BOTTLES.length).padStart(2,'0');
  document.getElementById('bnDots').innerHTML =
    BOTTLES.map((_,j)=>`<span class="bn-dot${j===i?' on':''}" onclick="navTo(${j})"></span>`).join('');
  updateBackBtn();

  const chips = b.status.map(s=>`<span class="chip ${s.k}"><span class="dot"></span>${s.t}</span>`).join('');

  /* ── drawer bodies ── */
  const tasteBody = `
    <div class="radar-wrap">${radarSVG(b.flavor)}</div>
    <div class="flavor-bars">
      ${FLAVOR_AXES.map(ax=>fbarRow(ax,b.flavor[ax])).join('')}
      <div class="fbar-divider"></div>
      ${fbarRow('Body',b.body,true)}
      ${fbarRow('Finish',b.finish,true)}
    </div>`;

  const madeBody = `
    <div class="spec-grid">${b.production.map(p=>
      `<div class="spec-cell${p[2]?' wide':''}"><div class="sl">${p[0]}</div><div class="sv">${p[1]}</div></div>`).join('')}</div>
    <div class="prod-tags">${b.prodTags.map(t=>`<span class="prod-tag">${t}</span>`).join('')}</div>`;

  const pressEntries = (b.press||[]).filter(p=>p.verified)
    .sort((a,c)=>c.date.localeCompare(a.date))
    .map(p=>`<div class="press-item">
      <div class="press-meta"><span class="pd">${fmtDate(p.date)}</span> · ${p.source} · ${p.type}</div>
      <div class="press-title">${p.title}</div>
      <div class="press-sum">${p.summary}</div>
    </div>`).join('');
  const awardEntries = (b.awards||[]).filter(a=>a.verified)
    .map(a=>`<div class="award">${medalSVG()}<div><span class="at">${a.t}</span><span class="as">${a.s}</span></div></div>`).join('');
  const pressBody = [
    awardEntries ? `<div class="award-row">${awardEntries}</div>` : '',
    pressEntries ? `<div class="press-list">${pressEntries}</div>` : '',
  ].filter(Boolean).join('');

  const tableBody = b.pairings.map(p=>
    `<div class="pair-row"><span class="pair-icon">${p[0]}</span><span class="pair-type">${p[1]}</span><span class="pair-val">${p[2]}</span></div>`).join('');

  const distBody = `
    <div class="dist-plate">
      <div class="dist-ping">
        <svg viewBox="0 0 60 60" width="48" aria-hidden="true">
          <circle cx="30" cy="30" r="22" fill="none" stroke="rgba(200,144,26,0.2)" stroke-width="1"/>
          <circle cx="30" cy="30" r="13" fill="none" stroke="rgba(200,144,26,0.35)" stroke-width="1"/>
          <line x1="30" y1="4" x2="30" y2="56" stroke="rgba(200,144,26,0.15)" stroke-width="1"/>
          <line x1="4" y1="30" x2="56" y2="30" stroke="rgba(200,144,26,0.15)" stroke-width="1"/>
          <circle cx="30" cy="30" r="3.5" fill="#e8b84a"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
        </svg>
      </div>
      <div class="dist-loc">
        <div class="dn">${b.dist.name}</div>
        <div class="dp">${b.dist.place}<br><span class="dcoord">${b.dist.coord}</span></div>
      </div>
    </div>
    <p class="dist-history">${b.dist.history}</p>
    <div class="timeline">${b.dist.timeline.map(t=>
      `<div class="tl-item"><div class="tl-year">${t[0]}</div><div class="tl-text">${t[1]}</div></div>`).join('')}</div>
    <div class="btb-stats" style="margin-top:20px;">${b.btb.stats.map(s=>
      `<div class="btb-stat"><div class="v">${s[1]}</div><div class="l">${s[0]}</div></div>`).join('')}</div>
    ${b.btb.facts.map(f=>
      `<div class="fact-item"><span class="fd">◆</span><span class="ft">${f}</span></div>`).join('')}`;

  const PATHS = [['lighter','◇','Lighter'],['similar','◆','Similar'],['adventurous','✦','Adventurous']];
  const compareBody = PATHS.map(([key,mark,label])=>{
    const rows = (b.paths?.[key]||[]).map(cmpRow).join('');
    return rows ? `<div class="path-label"><span class="pl-mark">${mark}</span>${label}</div>${rows}` : '';
  }).join('');

  // Sean-owned voice fields render only once Sean has supplied real copy.
  // Until then they stay absent (never the internal "Pending Sean review." placeholder).
  const SEAN_PENDING = 'Pending Sean review.';
  const hasSeanText = (v) => !!(v && String(v).trim() && String(v).trim() !== SEAN_PENDING);
  const hasSeanNotes = hasSeanText(b.notes);
  const hasSeanCue = hasSeanText(b.seanShort);
  const notesBody = `
    <p class="notes-text">${b.notes}</p>
    <div class="notes-sig">— Sean<span>Echo's Reserve · Curator</span></div>`;

  /* ── assemble ── */
  document.getElementById('detailBody').innerHTML = `
    <div class="hero">
      <div class="hero-cat">— ${b.cat} —</div>
      <div class="hero-bottle-wrap">${bottleSVG(b.silo,116).replace('<svg','<svg class="hero-bottle"')}</div>
      <div class="hero-name">${b.name}</div>
      <div class="hero-distillery">${b.distillery}</div>
      <div class="hero-chips">${chips}</div>
      <div class="hero-specs">
        <div class="hspec"><div class="v">${b.proof}</div><div class="l">Proof</div></div>
        <div class="hspec"><div class="v">${b.age}</div><div class="l">Age</div></div>
        <div class="hspec"><div class="v">${b.price}</div><div class="l">${b.priceL}</div></div>
        <div class="hspec"><div class="v">${b.cat}</div><div class="l">Category</div></div>
      </div>
      <div class="hero-style">${b.style}</div>
    </div>
    <div class="swipe-hint">← swipe between bottles →</div>

    <div class="card snapshot">
      <div class="card-eyebrow">Flavor Snapshot</div>
      <div class="snap-grid">
        <div class="snap-radar">${radarMini(b.flavor)}</div>
        <div class="snap-notes">
          ${b.topNotes.map((n,k)=>`<div class="tnote"><span class="tn-rank">0${k+1}</span><span class="tn-text">${n}</span></div>`).join('')}
        </div>
      </div>
      <div class="snap-caption">Full profile in Taste &amp; Texture below</div>
    </div>

    <p class="summary-why">${b.whyShort}</p>

    <div class="cue-card">
      ${hasSeanCue ? `<div class="cue-text">${b.seanShort}</div>` : ''}
      <div class="reviewed"><span class="rd">✓</span> Dossier reviewed ${fmtDate(b.reviewedAt)}</div>
    </div>

    ${drawer('taste','Taste & Texture', tasteBody)}
    ${drawer('made','How It Is Made', madeBody)}
    ${drawer('why','Why It Matters', `<p class="why-text">${b.why}</p>`)}
    ${drawer('carry','Why We Carry It', `<p class="why-text">${b.whyWeCarry}</p>`)}
    ${pressBody ? drawer('press','Recognition & Press', pressBody) : ''}
    ${drawer('table','At the Table', tableBody)}
    ${drawer('dist','Distillery Story', distBody)}
    ${drawer('compare','Compare & Continue', compareBody)}
    ${hasSeanNotes ? drawer('notes',"Sean's Notes", notesBody, 'notes-drawer') : ''}

    <div class="vault-footer">
      <div class="vf-coming">Coming to the Vault — <b>Save Favorites · Build Your Own Flight · Cocktail Recipes · Tasting Alerts</b></div>
    </div>
  `;
  window.scrollTo({top:0});
}

function stepBottle(d){ navTo((current + d + BOTTLES.length) % BOTTLES.length); }
function gotoBottle(i){ showDetail(); renderDetail(i); window.scrollTo({top:0}); }
// Fresh navigation (pager, dots, vault card) resets the Compare & Continue trail.
function navTo(i){ navStack = []; gotoBottle(i); }
// Following a Compare & Continue link remembers where you came from.
function goBack(){ if(navStack.length){ gotoBottle(navStack.pop()); } }
function updateBackBtn(){
  const el = document.getElementById('bnBack');
  if(!el) return;
  if(navStack.length){
    const prev = BOTTLES[navStack[navStack.length-1]];
    document.getElementById('bnBackName').textContent = prev ? ' · ' + prev.name : '';
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

/* ═══════════════════════════════════════════════
   VAULT (BROWSE) VIEW + FILTERS
═══════════════════════════════════════════════ */

const filters = {cat:'All', proof:'All', flavor:'All'};

const PROOF_BUCKETS = {
  'All': ()=>true,
  'Under 90': b=>b.proofN<90,
  '90–100': b=>b.proofN>=90 && b.proofN<=100,
  '100+': b=>b.proofN>100,
};
const FLAVOR_LEANS = {
  'All': ()=>true,
  'Sweet & Rich': b=>b.flavor.Sweet>=7,
  'Fruit-Forward': b=>b.flavor.Fruit>=6,
  'Spice-Driven': b=>b.flavor.Spice>=5,
  'Earthy & Herbal': b=>(b.flavor.Earth+b.flavor.Herbal)>=10,
  'Oak-Heavy': b=>b.flavor.Oak>=6,
};

function chipRow(el, options, key){
  document.getElementById(el).innerHTML = options.map(o=>
    `<button class="fchip${filters[key]===o?' on':''}" onclick="setFilter('${key}','${o.replace(/'/g,"\\'")}')">${o}</button>`).join('');
}

function setFilter(key,val){ filters[key]=val; renderVault(); }

function renderVault(){
  chipRow('fCat', ['All','Bourbon','Rye','American','Scotch','Agave','Rum'], 'cat');
  chipRow('fProof', Object.keys(PROOF_BUCKETS), 'proof');
  chipRow('fFlavor', Object.keys(FLAVOR_LEANS), 'flavor');

  const list = BOTTLES.map((b,i)=>({b,i})).filter(({b})=>
    (filters.cat==='All' || b.cat===filters.cat) &&
    PROOF_BUCKETS[filters.proof](b) &&
    FLAVOR_LEANS[filters.flavor](b)
  );

  document.getElementById('vaultCount').textContent =
    list.length + ' OF ' + BOTTLES.length + ' DOSSIERS · ' + SPIRIT_COLLECTION_TARGET + ' AT LAUNCH';

  document.getElementById('vaultGrid').innerHTML = list.map(({b,i})=>`
    <div class="vcard" onclick="navTo(${i})">
      <span class="vstatus ${b.status[0].k}"></span>
      ${bottleSVG(b.silo,74).replace('<svg','<svg class="vcard-bottle"')}
      <div class="vn">${b.name}</div>
      <div class="vd">${b.cat} · ${b.proof} Proof<br>${b.price} · ${b.age}</div>
    </div>`).join('')
    || '';
}

function showVault(){
  document.getElementById('view-detail').classList.remove('active');
  document.getElementById('view-vault').classList.add('active');
  renderVault();
  window.scrollTo({top:0});
}
function showDetail(){
  document.getElementById('view-vault').classList.remove('active');
  document.getElementById('view-detail').classList.add('active');
}

/* ═══════════════════════════════════════════════
   SWIPE
═══════════════════════════════════════════════ */

let tX=null, tY=null;
document.getElementById('view-detail').addEventListener('touchstart',e=>{
  tX=e.touches[0].clientX; tY=e.touches[0].clientY;
},{passive:true});
document.getElementById('view-detail').addEventListener('touchend',e=>{
  if(tX===null) return;
  const dx=e.changedTouches[0].clientX-tX, dy=e.changedTouches[0].clientY-tY;
  if(Math.abs(dx)>64 && Math.abs(dx)>Math.abs(dy)*1.6) stepBottle(dx<0?1:-1);
  tX=tY=null;
},{passive:true});

document.addEventListener('keydown',e=>{
  if(document.getElementById('view-detail').classList.contains('active')){
    if(e.key==='ArrowRight') stepBottle(1);
    if(e.key==='ArrowLeft') stepBottle(-1);
    if(e.key==='Escape' && navStack.length){ e.preventDefault(); goBack(); }
  }
});

/* ═══════════════════════════════════════════════
   SESSION COUNTDOWN (mock — 4 hr QR token)
═══════════════════════════════════════════════ */

let sessionSecs = 3*3600 + 47*60;
function tickSession(){
  sessionSecs = Math.max(0, sessionSecs-1);
  const h=Math.floor(sessionSecs/3600), m=Math.floor(sessionSecs%3600/60), s=sessionSecs%60;
  document.getElementById('sessionTimer').textContent =
    h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
setInterval(tickSession,1000);

/* INIT */
renderDetail(0);
</script>
</body>
